  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('khanx_theme');
        var activeTheme = (savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : 'dark';
        document.documentElement.setAttribute('data-theme', activeTheme);
      } catch (e) { }
    })();
  </script>
  <script>
    /* ── AUTH GUARD: redirect to login if no active session ── */
    (function () {
      try {
        var session = localStorage.getItem('khanx_session');
        var isLocal = window.location.protocol === 'file:';
        var loginUrl = isLocal ? 'login.html' : '/login';
        var redirect = loginUrl + window.location.search + window.location.hash;
        
        if (!session) { window.location.replace(redirect); return; }
        var parsed = JSON.parse(session);
        if (!parsed) { window.location.replace(redirect); return; }
        if (!parsed.email && !parsed.isGuest) { window.location.replace(redirect); }
      } catch (e) { window.location.replace(loginUrl || 'login.html'); }
    })();
  </script>

    #bw1 { width: 750px; height: 750px; top: -220px; left: -220px; }

    @keyframes twinkle1 { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.75; } }
    @keyframes twinkle2 { 0% { opacity: 1; } 50% { opacity: 0.65; } 100% { opacity: 0.9; } }

    /* Brighter star accents with glow */
    .star-accents { position: absolute; inset: 0; }
    .star-accent {
      position: absolute; width: 3px; height: 3px; border-radius: 50%;
      background: white;
      box-shadow: 0 0 4px 1px rgba(200, 200, 255, 0.8), 0 0 10px 2px rgba(150, 150, 255, 0.4);
      animation: starGlow 3s ease-in-out infinite alternate;
    }
    .star-accent:nth-child(1) { top: 12%; left: 32%; animation-delay: 0s; }
    .star-accent:nth-child(2) { top: 20%; left: 58%; animation-delay: 0.8s; width: 2.5px; height: 2.5px; }
    .star-accent:nth-child(3) { top: 45%; left: 22%; animation-delay: 1.5s; }
    .star-accent:nth-child(4) { top: 35%; left: 78%; animation-delay: 0.3s; width: 2px; height: 2px; }
    .star-accent:nth-child(5) { top: 60%; left: 45%; animation-delay: 2.1s; }
    .star-accent:nth-child(6) { top: 75%; left: 68%; animation-delay: 1.2s; width: 3.5px; height: 3.5px; }
    .star-accent:nth-child(7) { top: 28%; left: 15%; animation-delay: 0.6s; width: 2px; height: 2px; }
    .star-accent:nth-child(8) { top: 82%; left: 35%; animation-delay: 1.8s; }
    .star-accent:nth-child(9) { top: 55%; left: 88%; animation-delay: 0.4s; width: 2.5px; height: 2.5px; }
    .star-accent:nth-child(10) { top: 8%; left: 72%; animation-delay: 2.5s; }
    @keyframes starGlow {
      0% { opacity: 0.5; transform: scale(0.8); box-shadow: 0 0 3px 1px rgba(200,200,255,0.5), 0 0 6px 2px rgba(150,150,255,0.2); }
      100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 6px 2px rgba(200,200,255,0.9), 0 0 14px 4px rgba(150,150,255,0.5); }
    }

    /* Shooting stars */
    .shooting-star {
      position: absolute; width: 120px; height: 1.5px;
      background: linear-gradient(90deg, rgba(255,255,255,0.9), rgba(255,255,255,0.3), transparent);
      border-radius: 50px; opacity: 0; pointer-events: none;
    }
    .shooting-star:nth-child(1) { top: 12%; left: 30%; transform: rotate(-25deg); animation: shootStar1 8s linear infinite 2s; }
    .shooting-star:nth-child(2) { top: 22%; left: 65%; transform: rotate(-18deg); animation: shootStar2 12s linear infinite 6s; }
    .shooting-star:nth-child(3) { top: 55%; left: 50%; transform: rotate(-30deg); animation: shootStar3 15s linear infinite 10s; }
    @keyframes shootStar1 {
      0% { opacity: 0; transform: rotate(-25deg) translateX(0); }
      2% { opacity: 1; }
      8% { opacity: 0; transform: rotate(-25deg) translateX(280px); }
      100% { opacity: 0; }
    }
    @keyframes shootStar2 {
      0% { opacity: 0; transform: rotate(-18deg) translateX(0); }
      1.5% { opacity: 0.8; }
      6% { opacity: 0; transform: rotate(-18deg) translateX(250px); }
      100% { opacity: 0; }
    }
    @keyframes shootStar3 {
      0% { opacity: 0; transform: rotate(-30deg) translateX(0); }
      1% { opacity: 0.7; }
      5% { opacity: 0; transform: rotate(-30deg) translateX(300px); }
      100% { opacity: 0; }
    }


    /* Particle Canvas */
    #particleCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
    
    /* Cursor Glow (hidden to maintain clean normal cursor) */
    #cursorGlow { display: none !important; }
    /* Force default cursor when effects are disabled */
    body.cursor-default, body.cursor-default * { cursor: default !important; }

    /* App Shell */
    #app { position: relative; z-index: 10; display: flex; height: 100vh; width: 100vw; overflow: hidden; }
    #sidebar { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; background: transparent; border-right: 1px solid var(--border); overflow-y: auto; scrollbar-width: none; z-index: 30; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease, margin 0.3s ease, opacity 0.3s ease, left 0.3s ease, background 0.35s ease, backdrop-filter 0.35s ease; }
    [data-theme="dark"] #sidebar { background: rgba(6, 8, 26, 0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-right-color: rgba(255, 255, 255, 0.06); }
    #sidebar::-webkit-scrollbar { display: none; }

    /* Desktop Collapsed Sidebar State */
    #sidebar.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      border-right: none !important;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }

    /* Sidebar Backdrop Overlay */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .sidebar-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Mobile Responsive Sidebar Drawer (< 768px) */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: -280px;
        width: 260px;
        background: var(--bg) !important;
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.35);
        z-index: 30;
      }
      [data-theme="dark"] #sidebar {
        background: #0b0f1a !important;
      }
      #sidebar.open {
        left: 0 !important;
      }
    }
    .sb-top { display: flex; align-items: center; justify-content: space-between; padding: 10px; }
    .sb-new-chat { display: flex; align-items: center; gap: 8px; flex: 1; padding: 10px; border-radius: var(--r-md); background: transparent; border: none; cursor: pointer; color: var(--text); font-size: 14px; font-weight: 500; text-align: left; transition: background 0.2s; font-family: inherit; }
    .sb-new-chat:hover { background: var(--hover-bg); }
    .sb-toggle { background: transparent; border: none; padding: 10px; border-radius: var(--r-md); cursor: pointer; color: var(--text-sub); transition: background 0.2s; font-size: 16px; }

    /* ── Markdown Body ── */
    .markdown-body { font-size: 15px; line-height: 1.75; color: var(--text); }

    /* Inline code */
    .markdown-body code { font-family: 'Fira Code', 'Cascadia Code', 'Courier New', monospace; font-size: 13px; background: var(--code-inline-bg); padding: 2px 7px; border-radius: 5px; color: var(--text); }
    /* Code blocks */

    .markdown-body pre code { background: none !important; padding: 0; font-size: 13px; border-radius: 0; line-height: 1.65; color: inherit; }
    /* Tables */
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14px; }

  <script>
    /* ── Constants ── */
    const GUEST_KEY = 'khanx_guest';
    const THEME_STORAGE_KEY = 'khanx_theme';

    let isGuest = false, guestData = null, history = [], theme = 'light', mode = 'chat', loading = false;
    let currentSessionId = null;
    let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
    let cursorEffectEnabled = true;
    let currentAttachedFile = null;
    let thinkModeActive = false;

    function validateFile(file) {
      if (!file) return false;
      const MAX_SIZE = 25 * 1024 * 1024; // 25 MB
      if (file.size > MAX_SIZE) {
        showVoiceToast(`File is too large (${formatFileSize(file.size)}). Max limit is 25 MB.`);
        return false;
      }
      const allowedExts = ['.pdf','.docx','.doc','.pptx','.ppt','.txt','.md','.csv','.tsv','.xlsx','.xls','.png','.jpg','.jpeg','.webp','.bmp','.gif'];
      const ext = '.' + file.name.split('.').pop().toLowerCase();
      if (!allowedExts.includes(ext)) {
        showVoiceToast(`Unsupported file type (${ext}). Supported: PDF, DOCX, PPTX, XLSX, CSV, TXT, PNG, JPG, WEBP, GIF.`);
        return false;
      }
      return true;
    }

    function handleFileSelect(file) {
      if (!file) return;
      if (!validateFile(file)) return;
      currentAttachedFile = file;
      const previewArea = document.getElementById('attachedPreviewArea');
      if (!previewArea) return;

      // Clear any previous preview content
      const oldThumb = previewArea.querySelector('.attached-thumb-wrapper');
      const oldChip  = previewArea.querySelector('.attached-doc-chip');
      if (oldThumb) oldThumb.remove();
      if (oldChip)  oldChip.remove();

      if (file.type && file.type.startsWith('image/')) {
        // Image: show thumbnail preview
        const reader = new FileReader();
        reader.onload = function(e) {
          const wrapper = document.createElement('div');
          wrapper.className = 'attached-thumb-wrapper';
          const safeName = typeof escapeHtml === 'function' ? escapeHtml(file.name) : file.name;
          wrapper.innerHTML = `
            <img src="${e.target.result}" alt="${safeName}" />
            <button class="remove-attach-btn" onclick="clearAttachedFile()" title="Remove">✕</button>
          `;
          previewArea.appendChild(wrapper);
          previewArea.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      } else {
        // Document: show doc chip preview — upload executed on send()
        const ext = file.name.split('.').pop().toUpperCase();
        const sizeStr = typeof formatFileSize === 'function' ? formatFileSize(file.size) : (Math.round(file.size / 1024) + ' KB');
        const iconMap = { PDF: '📄', DOCX: '📝', DOC: '📝', PPTX: '📊', PPT: '📊', XLSX: '📊', XLS: '📊', CSV: '📋', TXT: '📃', MD: '📃' };
        const icon = iconMap[ext] || '📁';
        const chip = document.createElement('div');
        chip.className = 'attached-doc-chip';
        const safeName = typeof escapeHtml === 'function' ? escapeHtml(file.name) : file.name;
        chip.innerHTML = `
          <span class="attached-doc-icon">${icon}</span>
          <div class="attached-doc-info">
            <span class="attached-doc-name" title="${safeName}">${safeName}</span>
            <span class="attached-doc-meta">${ext} · ${sizeStr}</span>
          </div>
          <button class="remove-attach-btn" onclick="clearAttachedFile()" title="Remove">✕</button>
        `;
        previewArea.appendChild(chip);
        previewArea.classList.remove('hidden');
      }
    }

    function quickPrompt(text) {
      const input = document.getElementById('msgInput');
      if (input) {
        input.value = text;
        input.focus();
        if (typeof send === 'function') send();
      }
    }

    function clearAttachedFile() {
      currentAttachedFile = null;
      const fileInput = document.getElementById('fileInput');
      if (fileInput) fileInput.value = '';
      const previewArea = document.getElementById('attachedPreviewArea');
      if (previewArea) {
        previewArea.classList.add('hidden');
        const thumb = previewArea.querySelector('.attached-thumb-wrapper');
        const chip  = previewArea.querySelector('.attached-doc-chip');
        if (thumb) thumb.remove();
        if (chip)  chip.remove();
      }
    }

    function toggleProfileMenu() {
      const pd = document.getElementById('profileDropdown');
      if (pd) pd.classList.toggle('hidden');
    }

    document.addEventListener('click', function(e) {
      const topProfileBtn = document.getElementById('topProfileBtn');
      const pd = document.getElementById('profileDropdown');
      if (pd && !pd.classList.contains('hidden')) {
        if (topProfileBtn && !topProfileBtn.contains(e.target) && !pd.contains(e.target)) {
          pd.classList.add('hidden');
        }
      }
    });

    function toggleSidebarDrawer() {
      const sb = document.getElementById('sidebar');
      let overlay = document.getElementById('sidebarOverlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'sidebarOverlay';
        overlay.className = 'sidebar-overlay';
        overlay.onclick = toggleSidebarDrawer;
        document.body.appendChild(overlay);
      }
      const isMobile = window.innerWidth <= 768;
      if (sb) {
        if (isMobile) {
          sb.classList.toggle('open');
          sb.classList.remove('collapsed');
          overlay.classList.toggle('active', sb.classList.contains('open'));
        } else {
          sb.classList.toggle('collapsed');
          sb.classList.remove('open');
          overlay.classList.remove('active');
        }
      }
    }

    function triggerAction(action) {
      const input = document.getElementById('msgInput');
      if (!input) return;
      if (action === 'image') {
        input.value = 'Create an image of ';
        input.focus();
      } else if (action === 'write') {
        input.value = 'Write or edit ';
        input.focus();
      }
    }

    function toggleAutoMode() {
      const sw = document.getElementById('autoToggle');
      if (sw) sw.classList.toggle('on');
    }

    function toggleThinkMode() {
      thinkModeActive = !thinkModeActive;
      const btn = document.getElementById('thinkBtn');
      if (btn) btn.classList.toggle('active', thinkModeActive);
    }

    function setNavMode(mode) {
      const btnChat = document.getElementById('btnNavChat');
      const btnWork = document.getElementById('btnNavWork');
      if (btnChat) btnChat.classList.toggle('active', mode === 'chat');
      if (btnWork) btnWork.classList.toggle('active', mode === 'work');
      if (typeof setMode === 'function') {
        setMode(mode === 'work' ? 'rag' : 'chat');
      }
    }

    const P_LIGHT = [
      { r: 29,  g: 78,  b: 216 },
      { r: 14,  g: 165, b: 233 },
      { r: 236, g: 72,  b: 153 },
      { r: 59,  g: 130, b: 246 },
      { r: 16,  g: 185, b: 129 },
    ];
    const P_DARK  = [
      { r: 96,  g: 165, b: 250 },
      { r: 56,  g: 189, b: 248 },
      { r: 244, g: 114, b: 182 },
      { r: 129, g: 140, b: 248 },
      { r: 52,  g: 211, b: 153 },
    ];

    window.loadDocuments = async (passedToken, API_BASE) => {
        try {
            const token = (typeof window.getAuthToken === 'function') ? (await window.getAuthToken() || passedToken) : passedToken;
            if (!token) return;
            if (API_BASE === undefined) {
                const isLocal = window.location.protocol === 'file:';
                API_BASE = isLocal ? 'http://127.0.0.1:8000' : '';
            }
            
            const res = await fetch(API_BASE + '/api/documents/', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const docs = await res.json();
            }
        } catch (e) {
            console.error("Error loading documents:", e);
        }
    };

    function formatFileSize(bytes) {
        if (!bytes || bytes === 0) return 'Document';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    window.uploadPDF = async (file) => {
        if (!file) return false;
        if (typeof validateFile === 'function' && !validateFile(file)) return false;

        const originalBtnText = '+';
        const attachBtn = document.querySelector('.input-icon-btn[title="Attach file"]');
        if (attachBtn) {
            attachBtn.innerText = '⏳';
            attachBtn.disabled = true;
        }

        const cardId = 'up-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
        const isImage = file.type.startsWith('image/') || /\.(png|jpe?g|webp|bmp|gif)$/i.test(file.name);
        const localPreviewUrl = isImage ? URL.createObjectURL(file) : null;

        // Immediately show upload card directly inside user's chat message bubble (like ChatGPT)
        const messagesWin = document.getElementById('messages');
        const msgEl = document.createElement('div');
        msgEl.className = 'msg user';

        const av = document.createElement('div');
        av.className = 'msg-av';
        av.textContent = '👤';

        const bub = document.createElement('div');
        bub.className = 'msg-bub';

        const safeName = typeof escapeHtml === 'function' ? escapeHtml(file.name) : file.name;

        if (isImage) {
            bub.innerHTML = `
                <div class="chat-file-card image-card loading" id="${cardId}">
                    <div class="chat-file-preview">
                        <img src="${localPreviewUrl}" alt="${safeName}" class="chat-img-thumb" />
                        <div class="upload-progress-overlay">
                            <div class="upload-spinner"></div>
                            <span class="upload-pct-text" id="${cardId}-pct">0%</span>
                            <div class="upload-progress-bar"><div class="upload-progress-fill" id="${cardId}-bar" style="width: 0%"></div></div>
                        </div>
                    </div>
                </div>
            `;
        } else {
            bub.innerHTML = `
                <div class="chat-file-card doc-card loading" id="${cardId}">
                    <div class="chat-doc-row">
                        <div class="chat-doc-icon">📄</div>
                        <div class="chat-doc-details">
                            <span class="chat-doc-name">${safeName}</span>
                            <span class="chat-doc-meta">${typeof formatFileSize === 'function' ? formatFileSize(file.size) : 'File'}</span>
                        </div>
                    </div>
                    <div class="upload-progress-bar doc-progress"><div class="upload-progress-fill" id="${cardId}-bar" style="width: 0%"></div></div>
                </div>
            `;
        }

        msgEl.appendChild(av);
        msgEl.appendChild(bub);
        if (messagesWin) {
            messagesWin.appendChild(msgEl);
            messagesWin.scrollTop = messagesWin.scrollHeight;
        }

        try {
            let token = null;
            if (!isGuest && typeof window.getAuthToken === 'function') {
                token = await window.getAuthToken();
            }

            if (!token && !isGuest) {
                throw new Error("Please sign in to upload files.");
            }

            const isLocal = window.location.protocol === 'file:';
            const API_BASE = isLocal ? 'http://127.0.0.1:8000' : '';

            // Fast Image Compression with 1.5s timeout guarantee
            let fileToUpload = file;
            if (isImage && file.size > 500 * 1024) {
                fileToUpload = await Promise.race([
                    new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const img = new Image();
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                let w = img.width, h = img.height;
                                const MAX_DIM = 1920;
                                if (w > MAX_DIM || h > MAX_DIM) {
                                    if (w > h) { h = Math.round((h * MAX_DIM) / w); w = MAX_DIM; }
                                    else { w = Math.round((w * MAX_DIM) / h); h = MAX_DIM; }
                                }
                                canvas.width = w; canvas.height = h;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, w, h);
                                canvas.toBlob((blob) => {
                                    if (blob) resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() }));
                                    else resolve(file);
                                }, 'image/jpeg', 0.82);
                            };
                            img.onerror = () => resolve(file);
                            img.src = e.target.result;
                        };
                        reader.onerror = () => resolve(file);
                        reader.readAsDataURL(file);
                    }),
                    new Promise((resolve) => setTimeout(() => resolve(file), 1500))
                ]);
            }

            const formData = new FormData();
            formData.append("file", fileToUpload);

            await new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open("POST", API_BASE + '/api/documents/upload', true);
                if (token) {
                    xhr.setRequestHeader("Authorization", "Bearer " + token);
                }

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const pct = Math.round((e.loaded / e.total) * 100);
                        if (attachBtn) attachBtn.innerText = pct + '%';
                        const pctEl = document.getElementById(cardId + '-pct');
                        if (pctEl) pctEl.innerText = pct + '%';
                        const barEl = document.getElementById(cardId + '-bar');
                        if (barEl) barEl.style.width = pct + '%';
                    }
                };

                xhr.onload = async () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const fileInputEl = document.getElementById('fileInput');
                        if (fileInputEl) fileInputEl.value = '';
                        if (token && typeof window.loadDocuments === 'function') {
                            await window.loadDocuments(token, API_BASE);
                        }

                        const cardEl = document.getElementById(cardId);
                        if (cardEl) {
                            cardEl.classList.remove('loading');
                            cardEl.classList.add('completed');
                        }
                        resolve(true);
                    } else {
                        let errStr = 'Upload failed';
                        try { errStr = JSON.parse(xhr.responseText).detail || errStr; } catch (e) { }
                        reject(new Error(errStr));
                    }
                };

                xhr.onerror = () => reject(new Error("Network error during upload"));
                xhr.send(formData);
            });
            return true;
        } catch (e) {
            console.error("Error uploading file:", e);
            const cardEl = document.getElementById(cardId);
            if (cardEl) {
                cardEl.classList.remove('loading');
                cardEl.classList.add('error');
                const detEl = cardEl.querySelector('.chat-doc-details') || cardEl.querySelector('.upload-progress-overlay');
                if (detEl) {
                    detEl.innerHTML = `<span style="color:#ef4444; font-size:12px; font-weight:600;">❌ ${typeof escapeHtml === 'function' ? escapeHtml(e.message) : e.message}</span>`;
                }
            }
            if (typeof showVoiceToast === 'function') {
                showVoiceToast("Upload error: " + e.message);
            }
            return false;
        } finally {
            if (attachBtn) {
                attachBtn.innerText = originalBtnText;
                attachBtn.disabled = false;
            }
        }
    };

    // ── Drag & Drop File Upload Handlers ──────────────────────────────────────
    ['dragenter', 'dragover'].forEach(eventName => {
      window.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        const inputArea = document.getElementById('inputArea');
        if (inputArea) inputArea.classList.add('drag-over');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      window.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        const inputArea = document.getElementById('inputArea');
        if (inputArea) inputArea.classList.remove('drag-over');
      }, false);
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        handleFileSelect(file);
      }
    });

    document.addEventListener('paste', (e) => {
        if (e.clipboardData && e.clipboardData.files && e.clipboardData.files.length > 0) {
            const file = e.clipboardData.files[0];
            e.preventDefault();
            handleFileSelect(file);
        }
    });

    (function init() {
      try {
        const sess = JSON.parse(localStorage.getItem('khanx_session'));
        if (sess && sess.isGuest) {
          isGuest = true;
          document.getElementById('sbGuestIndicator').classList.remove('hidden');
          document.getElementById('guestBadge').style.display = 'flex';
          const gd = localStorage.getItem(GUEST_KEY);
          if (gd) guestData = JSON.parse(gd);
          if (guestData && guestData.msgCount >= guestData.maxMessages) lockForGuest();
          const gh = localStorage.getItem('khanx_guest_history');
          if (gh) {
            history = JSON.parse(gh);
            if (history.length > 0) {
              // Move input out of the welcome screen since we have history to show BEFORE calling renderHistory
              const welcome = document.getElementById('welcome');
              const inputArea = document.getElementById('inputArea');
              const wrapper = document.getElementById('inputAreaWrapper');
              if (inputArea && wrapper) {
                wrapper.appendChild(inputArea);
                wrapper.classList.remove('hidden');
              }
              if (welcome) welcome.remove();
              renderHistory();
            }
          }
        } else {
          // Authenticated User Initialization
          const gInd = document.getElementById('sbGuestIndicator');
          if (gInd) gInd.classList.add('hidden');
          const gBadge = document.getElementById('guestBadge');
          if (gBadge) gBadge.style.display = 'none';
          
          // Set user's display name & avatar immediately if available in local session
          try {

    window.getAuthToken = async () => {
      try {
        if (window.chatBackend && window.chatBackend.getClient) {
          const client = await window.chatBackend.getClient();
          if (client) {
            const { data: { session }, error } = await client.auth.getSession();
            if (session) {
              const now = Math.floor(Date.now() / 1000);
              // Check if session is expired or expiring within 60 seconds
              if (!session.expires_at || session.expires_at - now < 60) {
                console.log("[Auth] Token expired or about to expire. Refreshing Supabase session...");
                const { data: refreshData, error: refreshError } = await client.auth.refreshSession();
                if (refreshError || !refreshData?.session) {
                  console.warn("[Auth] Session refresh failed:", refreshError);
                  if (typeof logout === 'function') logout();
                  return null;
                }
                const newSession = refreshData.session;
                let sess = {};
                try { sess = JSON.parse(localStorage.getItem('khanx_session') || '{}'); } catch(_) {}
                sess.token = newSession.access_token;
                localStorage.setItem('khanx_session', JSON.stringify(sess));
                return newSession.access_token;
              }
              // Active valid session token
              let sess = {};
              try { sess = JSON.parse(localStorage.getItem('khanx_session') || '{}'); } catch(_) {}
              if (sess.token !== session.access_token) {
                sess.token = session.access_token;
                localStorage.setItem('khanx_session', JSON.stringify(sess));
              }
              return session.access_token;
            }
          }
        }
        // Fallback to localStorage session token if Supabase client is not active
        const sessStr = localStorage.getItem('khanx_session');
        if (sessStr) {
          const sess = JSON.parse(sessStr);
          if (sess && (sess.token || sess.access_token)) {
            return sess.token || sess.access_token;
          }
        }
      } catch (e) {
        console.warn("Error retrieving auth token:", e);
      }
      return null;
    };

    // Mouse and Touch Event Tracking
    function updateCursorPos(x, y) {
      const now = performance.now();
      const dx = x - targetMouseX;
      const dy = y - targetMouseY;
      const distMoved = Math.sqrt(dx * dx + dy * dy);
      
      targetMouseX = x;
      targetMouseY = y;
      
      if (smoothMouseX < -500) {
        smoothMouseX = x;
        smoothMouseY = y;
      }
      
      // Spawn ripple wave if cursor moves fast enough
      if (distMoved > 16 && (now - lastMoveTime) > 50) {
        ripples.push({
          x: x,
          y: y,
          radius: 12,
          maxRadius: Math.min(260, distMoved * 4.5 + 90),
          alpha: 1.0,
          speed: 4 + Math.min(7, distMoved * 0.14)
        });
        if (ripples.length > 8) ripples.shift();
      }

      // Add to cursor history trail
      mouseTrail.unshift({ x: x, y: y, alpha: 1.0, time: now });
      if (mouseTrail.length > 18) mouseTrail.pop();

      lastMoveTime = now;
    }

      const dy = (e.clientY - innerHeight / 2) / (innerHeight / 2);
      if (blobEls && Array.isArray(blobEls)) {
        blobEls.forEach((wrap, i) => {
          if (wrap && depths[i]) {

    // ── Full-Screen Ambient Star-Shaped Particle System ──────────────────────
    let chatbotParticles = [];
    // ═══════════════════════════════════════════════════════════════════════════
    // FULL-SCREEN AMBIENT STAR-SHAPED PARTICLE ENGINE (PROMINENT & HIGH VISIBILITY)
    // ═══════════════════════════════════════════════════════════════════════════
    const FULLSCREEN_PARTICLE_CONFIG = {
      particleCount: 65,          // Total glowing stars floating across full chatbot UI
      particleSize: 8.5,          // Larger, prominent star outer radius (px)
      particleColor: [            // Vibrant Light & Dark Mode cosmic palette
        'rgba(99, 102, 241, ',   // Royal Indigo Star
        'rgba(14, 165, 233, ',   // Deep Sky Blue Star
        'rgba(139, 92, 246, ',  // Soft Violet Sparkle
        'rgba(16, 185, 129, ',  // Emerald Mint Star
        'rgba(236, 72, 153, ',  // Rose Pink Star
        'rgba(245, 158, 11, '   // Golden Amber Star
      ],
      particleOpacity: 0.85,      // Crisp, high-contrast star visibility
      movementSpeed: 0.85,        // Smooth drift speed factor
      randomness: 0.60,           // Flow variation coefficient
      glowIntensity: 0.50         // Radiant core star aura
    };

    // Helper function to draw crisp glowing 4-point and 5-point star geometry with spark core
    function drawStarShape(ctx, cx, cy, points, outerRadius, innerRadius, rotation, fillStyle, shadowColor, shadowBlur) {
      let rot = rotation || 0;
      const step = Math.PI / points;

      ctx.save();
      ctx.beginPath();
      for (let i = 0; i < points * 2; i++) {
        const r = (i % 2 === 0) ? outerRadius : innerRadius;
        const x = cx + Math.cos(rot) * r;
        const y = cy + Math.sin(rot) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        rot += step;
      }
      ctx.closePath();

      ctx.fillStyle = fillStyle;
      if (shadowColor && shadowBlur > 0) {
        ctx.shadowColor = shadowColor;
        ctx.shadowBlur = shadowBlur;
      }
      ctx.fill();

      // Center bright white spark core for instant star recognition
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(1, outerRadius * 0.22), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.fill();

      ctx.restore();
    }

    function initEnergyParticles(isMobile, W, H) {
      const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const targetCount = reducedMotion ? 15 : (isMobile ? Math.floor(FULLSCREEN_PARTICLE_CONFIG.particleCount * 0.55) : FULLSCREEN_PARTICLE_CONFIG.particleCount);
      if (chatbotParticles.length === targetCount) return;
      
      chatbotParticles = [];
      for (let i = 0; i < targetCount; i++) {
        chatbotParticles.push({
          x: Math.random() * (W || window.innerWidth),
          y: Math.random() * (H || window.innerHeight),
          vx: (Math.random() - 0.5) * 0.7 * FULLSCREEN_PARTICLE_CONFIG.movementSpeed,
          vy: (Math.random() - 0.5) * 0.7 * FULLSCREEN_PARTICLE_CONFIG.movementSpeed,
          driftAngle: Math.random() * Math.PI * 2,
          spinSpeed: (Math.random() - 0.5) * 0.012 * FULLSCREEN_PARTICLE_CONFIG.movementSpeed,
          speed: (0.4 + Math.random() * 0.6) * FULLSCREEN_PARTICLE_CONFIG.movementSpeed,
          size: (Math.random() * 2.2 + 5.0), // Star size variation from 5px to 7.2px
          starPoints: (i % 3 === 0) ? 5 : 4, // 4-pointed diamond spark stars & 5-pointed stars
          starRotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.018,
          innerRatio: 0.32,
          colorIdx: i % FULLSCREEN_PARTICLE_CONFIG.particleColor.length,
          pulseFreq: 0.0015 + Math.random() * 0.0025,
          pulsePhase: Math.random() * Math.PI * 2,
          trail: []
        });
      }
    }

    function renderEnergyField(ctx, smoothX, smoothY, isDark, isMobile, now) {
      if (!ctx) return;

      const W = pCanv.width, H = pCanv.height;
      initEnergyParticles(isMobile, W, H);

      const margin = 40;

      // ── LIGHT MODE: Connecting Lines Between Round Particles (Constellation Grid) ──
      if (!isDark) {
        const maxLinkDist = isMobile ? 100 : 135;
        const maxLinkDistSq = maxLinkDist * maxLinkDist;
        const len = chatbotParticles.length;
        for (let i = 0; i < len; i++) {
          const p1 = chatbotParticles[i];
          for (let j = i + 1; j < len; j++) {
            const p2 = chatbotParticles[j];
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            const distSq = dx * dx + dy * dy;
            if (distSq < maxLinkDistSq) {
              const dist = Math.sqrt(distSq);
              const lineAlpha = (1 - dist / maxLinkDist) * 0.25 * FULLSCREEN_PARTICLE_CONFIG.particleOpacity;
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(99, 102, 241, ${lineAlpha})`;
              ctx.lineWidth = 1.1;
              ctx.stroke();
            }
          }
        }
      }

      chatbotParticles.forEach(p => {
        // Organic full-screen drifting motion
        p.driftAngle += p.spinSpeed;
        p.starRotation += p.rotSpeed;
        p.x += Math.cos(p.driftAngle) * p.speed + p.vx;
        p.y += Math.sin(p.driftAngle * 0.85) * p.speed + p.vy;

        // Seamless screen wrapping across the entire viewport
        if (p.x < -margin) p.x = W + margin;
        if (p.x > W + margin) p.x = -margin;
        if (p.y < -margin) p.y = H + margin;
        if (p.y > H + margin) p.y = -margin;

        // Gentle interaction when cursor comes close anywhere on screen
        if (smoothX > 0 && smoothY > 0) {
          const dx = p.x - smoothX;
          const dy = p.y - smoothY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const pushRadius = 170;
          if (dist < pushRadius && dist > 0) {
            const push = (1 - dist / pushRadius) * 2.2;
            p.x += (dx / dist) * push;
            p.y += (dy / dist) * push;
          }
        }

        // Micro fading trail
        p.trail.unshift({ x: p.x, y: p.y, rot: p.starRotation });
        if (p.trail.length > (isMobile ? 3 : 5)) p.trail.pop();

        const colorBase = FULLSCREEN_PARTICLE_CONFIG.particleColor[p.colorIdx % FULLSCREEN_PARTICLE_CONFIG.particleColor.length];

        if (isDark) {
          // ── DARK THEME: Crisp Glowing 4-point & 5-point Star Shapes ──
          for (let t = p.trail.length - 1; t >= 0; t--) {
            const pt = p.trail[t];
            const alpha = (1 - t / p.trail.length) * 0.22 * FULLSCREEN_PARTICLE_CONFIG.particleOpacity;
            const tSize = Math.max(1.0, p.size * (1 - t / (p.trail.length * 1.3)));
            drawStarShape(
              ctx, pt.x, pt.y, p.starPoints,
              tSize, tSize * p.innerRatio,
              pt.rot, colorBase + alpha + ')', null, 0
            );
          }

          // Twinkling scale pulse
          const pulse = 0.85 + Math.sin(now * p.pulseFreq + p.pulsePhase) * 0.25;
          const outerR = p.size * pulse;
          const innerR = outerR * p.innerRatio;

          // Soft background star aura glow
          const auraOuterR = outerR * 2.0;
          const auraInnerR = innerR * 2.0;
          drawStarShape(
            ctx, p.x, p.y, p.starPoints,
            auraOuterR, auraInnerR,
            p.starRotation, colorBase + (0.20 * FULLSCREEN_PARTICLE_CONFIG.glowIntensity) + ')', null, 0
          );

          // Inner glowing star core with shadow blur
          drawStarShape(
            ctx, p.x, p.y, p.starPoints,
            outerR, innerR,
            p.starRotation, colorBase + (0.92 * FULLSCREEN_PARTICLE_CONFIG.particleOpacity) + ')',
            colorBase + '0.6)', 6
          );
        } else {
          // ── LIGHT THEME: Smooth Clean Round Particles (Smaller Micro-Dots) ──
          const circleRadius = Math.max(1.3, p.size * 0.28);

          // Render fading round trail
          for (let t = p.trail.length - 1; t >= 0; t--) {
            const pt = p.trail[t];
            const alpha = (1 - t / p.trail.length) * 0.18 * FULLSCREEN_PARTICLE_CONFIG.particleOpacity;
            const tSize = Math.max(0.4, circleRadius * (1 - t / (p.trail.length * 1.4)));
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, tSize, 0, Math.PI * 2);
            ctx.fillStyle = colorBase + alpha + ')';
            ctx.fill();
          }

          const pulse = 0.85 + Math.sin(now * p.pulseFreq + p.pulsePhase) * 0.18;
          const auraRadius = circleRadius * 2.0 * pulse;

          // Soft round particle aura
          ctx.beginPath();
          ctx.arc(p.x, p.y, auraRadius, 0, Math.PI * 2);
          ctx.fillStyle = colorBase + (0.12 * FULLSCREEN_PARTICLE_CONFIG.glowIntensity) + ')';
          ctx.fill();

          // Smooth round particle core
          ctx.beginPath();
          ctx.arc(p.x, p.y, circleRadius * pulse, 0, Math.PI * 2);
          ctx.fillStyle = colorBase + (0.85 * FULLSCREEN_PARTICLE_CONFIG.particleOpacity) + ')';
          ctx.shadowColor = colorBase + '0.35)';
          ctx.shadowBlur = 3;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });
    }

    function configureMarked() {
      if (typeof marked === 'undefined') return;
      const opts = { breaks: true, gfm: true };
      if (typeof marked.setOptions === 'function') {
        marked.setOptions(opts);
      } else if (typeof marked.use === 'function') {
        marked.use(opts);
      }
    }
    configureMarked();

    function escapeHtml(t) {
      return (t || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderMarkdown(text) {
      if (!text) return '';
      let cleaned = text.toString();

      // Convert literal escaped backslash sequences into real formatting characters
      if (cleaned.includes('\\n')) cleaned = cleaned.replace(/\\n/g, '\n');
      if (cleaned.includes('\\r')) cleaned = cleaned.replace(/\\r/g, '\r');
      if (cleaned.includes('\\t')) cleaned = cleaned.replace(/\\t/g, '\t');

      if (typeof marked === 'undefined') {
        return escapeHtml(cleaned).replace(/\n/g, '<br>');
      }

      try {
        let html = typeof marked.parse === 'function' ? marked.parse(cleaned) : marked(cleaned);
        if (typeof DOMPurify !== 'undefined' && typeof DOMPurify.sanitize === 'function') {
          html = DOMPurify.sanitize(html);
        }
        return html;
      } catch (e) {
        console.warn("Markdown render error:", e);
        return escapeHtml(cleaned).replace(/\n/g, '<br>');
      }
    }

    // ── SSE stream reader ──────────────────────────────────────────────────
    async function readStream(response) {
      let fullText = '';
      let bub = null;
      let firstTokenReceived = false;
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line in buffer
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (raw === '[DONE]') break;
          try {
            const parsed = JSON.parse(raw);
            if (parsed.text) {
              if (!firstTokenReceived) {
                firstTokenReceived = true;
                hideTypingIndicator();
                bub = createStreamBubble();
              }
              fullText += parsed.text;
              updateStreamBubble(bub, fullText);
            }
          } catch {}
        }
      }

      if (!firstTokenReceived) {
        hideTypingIndicator();
        bub = createStreamBubble();
      }

      return { bub, fullText };
    }

    function toggleSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        showVoiceToast("Voice input isn't supported in this browser.");
        return;
      }

      if (isListening && speechRecognitionInstance) {
        try {
          speechRecognitionInstance.stop();
        } catch (e) {
          console.warn("Error stopping speech recognition:", e);
        }
        updateMicBtnState(false);
        return;
      }

      try {
        speechRecognitionInstance = new SpeechRecognition();
        speechRecognitionInstance.continuous = true;
        speechRecognitionInstance.interimResults = true;
        speechRecognitionInstance.lang = navigator.language || 'en-US';

        const input = document.getElementById('msgInput');
        initialInputText = input ? input.value : '';

        speechRecognitionInstance.onstart = () => {
          updateMicBtnState(true);
        };

        speechRecognitionInstance.onresult = (event) => {
          if (!input) return;
          let transcript = '';
          for (let i = 0; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          const prefix = initialInputText ? (initialInputText.endsWith(' ') ? initialInputText : initialInputText + ' ') : '';
          input.value = prefix + transcript;
          input.style.height = 'auto';
          input.style.height = Math.min(input.scrollHeight, 200) + 'px';
        };

        speechRecognitionInstance.onerror = (event) => {
          console.warn("Speech recognition error:", event.error);
          if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
            showVoiceToast("Microphone access was denied or unavailable.");
          } else if (event.error !== 'no-speech' && event.error !== 'aborted') {
            showVoiceToast("Voice input error: " + event.error);
          }
          updateMicBtnState(false);
        };

        speechRecognitionInstance.onend = () => {
          updateMicBtnState(false);
        };

        speechRecognitionInstance.start();
      } catch (e) {
        console.error("Failed to start speech recognition:", e);
        showVoiceToast("Voice input failed to start.");
        updateMicBtnState(false);
      }
    }

    // ── Main send function ─────────────────────────────────────────────────
    async function send() {
      if (isListening && speechRecognitionInstance) {
        try { speechRecognitionInstance.stop(); } catch(e) {}
        updateMicBtnState(false);
      }
      const input = document.getElementById('msgInput');
      let text = input.value.trim();

      if (currentAttachedFile) {
        const fileToUpload = currentAttachedFile;
        clearAttachedFile();
        if (window.uploadPDF) {
          const success = await window.uploadPDF(fileToUpload);
          if (!success) {
            return;
          }
        }
        if (!text) {
          text = `Please analyze the uploaded file '${fileToUpload.name}'.`;
        } else {
          text = `[Attached File: ${fileToUpload.name}]\n${text}`;
        }
      }

      if (!text || loading) return;
      if (isGuest) {
        if (!guestData) guestData = { msgCount: 0, maxMessages: 2 };
        if (guestData.msgCount >= guestData.maxMessages) { lockForGuest(); return; }
        guestData.msgCount++;
        localStorage.setItem(GUEST_KEY, JSON.stringify(guestData));
      }

      const welcome = document.getElementById('welcome');
      if (welcome) {
        const inputArea = document.getElementById('inputArea');
        const wrapper = document.getElementById('inputAreaWrapper');
        wrapper.appendChild(inputArea); wrapper.classList.remove('hidden'); welcome.remove();
      }

      history.push({ role: 'user', content: text });
      appendMsg('user', text);
      input.value = ''; input.style.height = 'auto'; loading = true;
      showTypingIndicator();
      showStopButton();

      activeAbortController = new AbortController();
      const signal = activeAbortController.signal;

      const isLocal = window.location.protocol === 'file:';
      const API_BASE = isLocal ? 'http://127.0.0.1:8000' : '';

      try {
        const token = await window.getAuthToken();

        if (isGuest || !token) {
          // ── Guest streaming (no auth) ────────────────────────────────────
          if (mode === 'rag') {
            const res = await fetch(API_BASE + '/api/chat/rag', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ messages: history.slice(-8) }),
              signal
            });
            hideTypingIndicator();
            hideStopButton();
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            history.push({ role: 'assistant', content: data.reply });
            appendMsg('assistant', data.reply);
          } else {
            const res = await fetch(API_BASE + '/api/chat/stream', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ messages: history.slice(-8) }),
              signal
            });
            if (!res.ok) { hideTypingIndicator(); hideStopButton(); throw new Error(`HTTP ${res.status}`); }
            const { bub, fullText } = await readStream(res);
            finalizeStreamBubble(bub, fullText);
            hideStopButton();
            history.push({ role: 'assistant', content: fullText });
            if (isGuest) localStorage.setItem('khanx_guest_history', JSON.stringify(history));
          }

        } else {
          // ── Authenticated streaming ──────────────────────────────────────
          if (!window.currentSessionId) {
            const titleText = text.length > 30 ? text.substring(0, 27) + '...' : text;
            const sRes = await fetch(API_BASE + '/api/v1/chat/sessions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
              body: JSON.stringify({ title: titleText }),
              signal
            });
            if (sRes.ok) {
              const newSess = await sRes.json();
              window.currentSessionId = newSess.id;
              window.refreshAuthSessions();
            } else {
              hideTypingIndicator();
              hideStopButton();
              let errDetail = 'Failed to create session in backend';
              try {
                const errJson = await sRes.json();
                if (errJson && errJson.detail) errDetail = errJson.detail;
              } catch(_) {
                const errText = await sRes.text().catch(() => '');
                if (errText) errDetail = errText;
              }
              throw new Error(`Failed to create session in backend (${sRes.status}): ${errDetail}`);
            }
          }

          if (window.currentSessionId) {
            const mRes = await fetch(`${API_BASE}/api/v1/chat/sessions/${window.currentSessionId}/messages/stream`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
              body: JSON.stringify({ user_message: text, mode: mode }),
              signal
            });
            if (!mRes.ok) {
              hideTypingIndicator();
              hideStopButton();
              let errDetail = `HTTP ${mRes.status}`;
              try {
                const errText = await mRes.text();
                if (errText) errDetail = errText;
              } catch(_) {}
              throw new Error(`Stream failed: ${errDetail}`);
            }
            const { bub, fullText } = await readStream(mRes);
            finalizeStreamBubble(bub, fullText);
            hideStopButton();
            history.push({ role: 'assistant', content: fullText });
            window.refreshAuthSessions();
          }
        }
      } catch(e) {
        hideTypingIndicator();
        hideStopButton();
        if (e.name === 'AbortError') {
          console.log('Generation stopped by user.');
        } else {
          console.error('Send error:', e);
          let msg = '⚠️ ' + e.message;
          if (e.message.includes('Failed to fetch')) msg += ' — Is the backend running?';
          appendMsg('assistant', msg);
        }
      }
      activeAbortController = null;
      loading = false;
    }

    function groupSessionsByDate(sessions) {
      const groups = { today: [], yesterday: [], previous7Days: [], older: [] };
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const oneDayMs = 86400000;
      const startOfYesterday = startOfToday - oneDayMs;
      const startOf7Days = startOfToday - (6 * oneDayMs);

      sessions.forEach(sess => {
        const timestamp = sess.updated_at || sess.created_at;
        const sessTime = timestamp ? new Date(timestamp).getTime() : Date.now();
        if (sessTime >= startOfToday) groups.today.push(sess);
        else if (sessTime >= startOfYesterday) groups.yesterday.push(sess);
        else if (sessTime >= startOf7Days) groups.previous7Days.push(sess);
        else groups.older.push(sess);
      });
      return groups;
    }

        lightParts: [{r:61,g:126,b:235},{r:76,g:122,b:237},{r:92,g:119,b:238},{r:108,g:115,b:240},{r:122,g:111,b:240}],
        darkParts: [{r:120,g:165,b:255},{r:138,g:168,b:255},{r:157,g:172,b:255},{r:176,g:176,b:255},{r:190,g:181,b:255}]
      },
      coral: {
        color1: '#3D7EEB', color2: '#FF6B6B',
        lightParts: [{r:61,g:126,b:235},{r:110,g:121,b:204},{r:159,g:116,b:173},{r:208,g:110,b:142},{r:255,g:107,b:107}],
        darkParts: [{r:120,g:165,b:255},{r:163,g:167,b:236},{r:206,g:170,b:217},{r:236,g:164,b:193},{r:255,g:155,b:155}]
      },
      golden: {
        color1: '#00CED1', color2: '#FFD700',
        lightParts: [{r:0,g:206,b:209},{r:64,g:197,b:157},{r:128,g:188,b:105},{r:192,g:179,b:53},{r:255,g:215,b:0}],
        darkParts: [{r:100,g:235,b:237},{r:141,g:234,b:205},{r:182,g:233,b:173},{r:223,g:228,b:141},{r:255,g:245,b:120}]
      }
    };

    function hexToRgb(hex) {
      const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
      hex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : { r: 29, g: 78, b: 216 };
    }

    function applyPalette(paletteId) {
      const pal = PALETTES[paletteId] || PALETTES.default;
      localStorage.setItem('khanx_palette', paletteId);
      
      document.documentElement.style.setProperty('--purple', pal.color1);
      document.documentElement.style.setProperty('--cyan', pal.color2);
      
      const rgb1 = hexToRgb(pal.color1);
      const rgb2 = hexToRgb(pal.color2);
      document.documentElement.style.setProperty('--purple-rgb', `${rgb1.r}, ${rgb1.g}, ${rgb1.b}`);
      document.documentElement.style.setProperty('--cyan-rgb', `${rgb2.r}, ${rgb2.g}, ${rgb2.b}`);
      
      if (typeof P_LIGHT !== 'undefined') {
        P_LIGHT.length = 0;
        P_LIGHT.push(...pal.lightParts);
      }
      if (typeof P_DARK !== 'undefined') {
        P_DARK.length = 0;
        P_DARK.push(...pal.darkParts);
      }
    }

    function setCursorEffect(enabled) {
      cursorEffectEnabled = !!enabled;
      localStorage.setItem('khanx_cursor_effect', cursorEffectEnabled ? 'on' : 'off');
      console.log('[CursorToggle] setCursorEffect:', cursorEffectEnabled ? 'ON' : 'OFF');
      
      const pCanvEl = document.getElementById('particleCanvas');
      const cursorGlowEl = document.getElementById('cursorGlow');
      
      if (cursorEffectEnabled) {
        if (pCanvEl) pCanvEl.style.display = 'block';
        if (cursorGlowEl) cursorGlowEl.style.display = 'block';
        document.body.classList.remove('cursor-default');
      } else {
        if (pCanvEl) {
          pCanvEl.style.display = 'none';
          try {
            const ctx = pCanvEl.getContext('2d');
            if (ctx) ctx.clearRect(0, 0, pCanvEl.width, pCanvEl.height);
          } catch(e) {}
        }
        if (cursorGlowEl) {
          cursorGlowEl.style.display = 'none';
        }
        document.body.classList.add('cursor-default');
      }
      
      // Update toggle button UI
      const statusSpan = document.getElementById('cursorStatus');
      if (statusSpan) {
        statusSpan.textContent = cursorEffectEnabled ? 'ON' : 'OFF';
        statusSpan.style.background = cursorEffectEnabled ? '#10b981' : '#ef4444';
      }
    }

    function toggleCursorEffect() {
      setCursorEffect(!cursorEffectEnabled);
    }
    function setTheme(t) {
      if (t === 'grind') t = 'dark';
      theme = t;
      localStorage.setItem('khanx_theme', t);
      document.documentElement.setAttribute('data-theme', t);

      const btnLight = document.getElementById('btnLight');
      const btnDark = document.getElementById('btnDark');
      if (btnLight) btnLight.classList.toggle('active', t === 'light');
      if (btnDark) btnDark.classList.toggle('active', t === 'dark');

      const wTitle = document.getElementById('welcomeTitle');
      if (wTitle) {
        wTitle.textContent = 'How can I help you today?';
      }
    }
    window.setTheme = setTheme;

    // Initialize aesthetics settings (must run after all variables are declared)
    (function initAesthetics() {
      try {
        const savedTheme = localStorage.getItem('khanx_theme') || 'light';
        setTheme(savedTheme);

        const cursorVal = localStorage.getItem('khanx_cursor_effect');
        setCursorEffect(cursorVal !== 'off');

        const palVal = localStorage.getItem('khanx_palette') || 'sage';
        applyPalette(palVal);
        const pSel = document.getElementById('paletteSelect');
        if (pSel) pSel.value = palVal;
      } catch (e) {
        console.error('Error initializing aesthetics:', e);
      }
    })();
  </script>
</body>
